<!-- @dsCard group="Effects" viewport="700x190" name="Glows and shadows" subtitle="Type never gets a shadow. Only CTAs, stamps, modals and the hero lockup do." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div class="row" style="align-items:stretch">
<div class="sw"><div style="height:64px;background:var(--orange);clip-path:var(--clip-button);box-shadow:var(--glow-cta)"></div><div class="cap">--glow-cta</div><div class="val">0 22px 70px #f25a1842</div></div>
<div class="sw"><div style="height:64px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow-modal)"></div><div class="cap">--shadow-modal</div><div class="val">0 34px 110px #000000b8</div></div>
<div class="sw"><div style="height:64px;border-radius:50%;width:64px;margin:auto;border:2px solid var(--orange);background:var(--stamp-frost);box-shadow:var(--glow-stamp)"></div><div class="cap">--glow-stamp</div><div class="val">0 0 44px #f25a1829</div></div>
</div></body></html>
