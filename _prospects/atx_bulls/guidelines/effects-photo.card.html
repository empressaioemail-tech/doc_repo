<!-- @dsCard group="Effects" viewport="700x210" name="Photo treatment" subtitle="saturate(.95) contrast(1.04), left shade to near-black, bottom fade, radial orange bloom." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div class="row" style="align-items:stretch">
<div class="sw"><div style="height:120px;background:linear-gradient(115deg,#5a3a28,#0a0807)"></div><div class="cap">raw photo</div></div>
<div class="sw"><div style="position:relative;height:120px;background:linear-gradient(115deg,#5a3a28,#0a0807);filter:var(--photo-filter)"><div style="position:absolute;inset:0;background:var(--photo-shade)"></div><div style="position:absolute;inset:0;background:var(--photo-glow)"></div><div style="position:absolute;inset:0;background:var(--photo-fade-bottom)"></div><div style="position:absolute;left:14px;bottom:12px;font-family:var(--font-display);font-size:26px;letter-spacing:-.06em;text-transform:uppercase;color:var(--bone)">Austin tough</div></div><div class="cap">treated + type</div></div>
</div>
<div class="val" style="margin-top:12px">Night, high contrast, orange rim light, smoke, Austin skyline. No sunny daylight stock.</div></body></html>
