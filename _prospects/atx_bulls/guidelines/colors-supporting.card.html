<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div class="row">
<div class="sw"><div class="chip" style="background:var(--lede-hero);"></div><div class="cap">Hero lede</div><div class="val">#d3c9c0</div></div><div class="sw"><div class="chip" style="background:var(--lede);"></div><div class="cap">Section lede</div><div class="val">#d0c6bd</div></div><div class="sw"><div class="chip" style="background:var(--rail);"></div><div class="cap">Rails</div><div class="val">#a99e95</div></div><div class="sw"><div class="chip" style="background:var(--shade-1);border:1px solid var(--line)"></div><div class="cap">Overlay 1</div><div class="val">#050403</div></div><div class="sw"><div class="chip" style="background:var(--shade-3);border:1px solid var(--line)"></div><div class="cap">Overlay 3</div><div class="val">#030302</div></div><div class="sw"><div class="chip" style="background:var(--stamp-frost);border:1px solid var(--line)"></div><div class="cap">Stamp frost</div><div class="val">#050403c7</div></div>
</div></body></html>
