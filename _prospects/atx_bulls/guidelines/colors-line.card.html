<!-- @dsCard group="Colors" viewport="700x180" name="Hairlines, not cards" subtitle="--line is bone at 17%. Structure comes from 1px rules, never from shadows." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div style="display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)">
<div style="padding:20px;border-right:1px solid var(--line)"><div class="cap">Date</div><div style="font-family:var(--font-ui);font-weight:900;font-size:26px;text-transform:uppercase;color:var(--bone);margin-top:6px">August 30</div></div>
<div style="padding:20px"><div class="cap">Location</div><div style="font-family:var(--font-ui);font-weight:900;font-size:26px;text-transform:uppercase;color:var(--bone);margin-top:6px">Austin, Texas</div></div>
</div>
<div class="val" style="margin-top:12px">--line #f3eee62b · 1px solid · used top, bottom and between</div></body></html>
