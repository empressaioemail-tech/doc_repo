<!-- @dsCard group="Effects" viewport="700x180" name="Motion" subtitle="Everything transitions at 0.2s. CTAs rise 2px. Nothing scales or bounces." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:center;gap:14px"><span class="val" style="width:110px">--dur-base</span><span style="font-family:var(--font-ui);font-weight:900;font-size:15px;color:var(--bone);width:60px">0.2s</span><span class="cap">all hover / colour / border</span></div><div style="display:flex;align-items:center;gap:14px"><span class="val" style="width:110px">--dur-slow</span><span style="font-family:var(--font-ui);font-weight:900;font-size:15px;color:var(--bone);width:60px">0.36s</span><span class="cap">progress fills</span></div><div style="display:flex;align-items:center;gap:14px"><span class="val" style="width:110px">--dur-ticker</span><span style="font-family:var(--font-ui);font-weight:900;font-size:15px;color:var(--bone);width:60px">22s</span><span class="cap">ticker loop, linear</span></div><div style="display:flex;align-items:center;gap:14px"><span class="val" style="width:110px">--lift</span><span style="font-family:var(--font-ui);font-weight:900;font-size:15px;color:var(--bone);width:60px">-2px</span><span class="cap">CTA and panel hover rise</span></div>
<div class="val" style="margin-top:6px">prefers-reduced-motion: durations to 0, ticker paused, no lift.</div></div></body></html>
