<!-- @dsCard group="Geometry" viewport="700x190" name="The chamfer" subtitle="Bottom-right corner only. This replaces border-radius everywhere." -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:18px;background:var(--ink)}.cap{font-family:var(--font-ui);font-weight:800;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.val{font-family:var(--font-ui);font-weight:700;font-size:10px;letter-spacing:.1em;color:#7d746c;text-transform:uppercase}.sw{display:flex;flex-direction:column;gap:7px}.chip{height:58px}.row{display:flex;gap:10px}.row>*{flex:1}</style>
</head><body><div class="row" style="align-items:stretch">
<div class="sw"><div style="height:56px;background:var(--orange);clip-path:var(--clip-button);display:flex;align-items:center;justify-content:space-between;padding:0 26px;font-family:var(--font-ui);font-weight:900;font-size:14px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink)">Get in the arena <span>↗</span></div><div class="cap">--clip-button</div><div class="val">polygon(0 0,100% 0,100% 78%,94% 100%,0 100%)</div></div>
<div class="sw"><div style="height:56px;background:var(--panel);border:1px solid var(--line);clip-path:var(--clip-panel)"></div><div class="cap">--clip-panel</div><div class="val">polygon(0 0,100% 0,100% 93%,96% 100%,0 100%)</div></div>
</div>
<div class="val" style="margin-top:16px">border-radius: 0 everywhere. No pills, no 8px cards, no glassmorphism outside the nav blur and stamp frost.</div></body></html>
