<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Fan rewards screen" description="Mobile fan rewards home screen: points meter, next-game invert panel, earnable challenges, chant ticker and a featured reward." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;background:#080706;display:flex;justify-content:center}</style>
</helmet>
<div style="width:390px;min-height:844px;background:#080706;border:1px solid #f3eee62b;display:flex;flex-direction:column">
<header style="display:flex;align-items:center;justify-content:space-between;padding:14px 18px;background:#080706e6;border-bottom:1px solid #f3eee62b">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.Logo" variant="mark" height="{{ 40 }}" base="../../" hint-size="42px,40px"></x-import>
<div style="display:flex;gap:10px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.IconSquare" icon="bell" label="Alerts" variant="bone" size="{{ 38 }}" hint-size="38px,38px"></x-import>
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.IconSquare" icon="qr-code" label="Wallet" variant="bone" size="{{ 38 }}" hint-size="38px,38px"></x-import>
</div>
</header>
<main style="flex:1;display:flex;flex-direction:column;gap:18px;padding:18px 0 28px">
<div style="padding:0 18px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.PointsMeter" points="{{ points }}" tier="starter" nextTier="Captain" toNext="{{ toNext }}" hint-size="100%,240px"></x-import>
</div>
<div style="padding:0 18px">
<div style="padding:18px;background:#f25a18;color:#080706;clip-path:polygon(0 0,100% 0,100% 93%,96% 100%,0 100%)">
<div style="display:flex;align-items:center;gap:10px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.2em;text-transform:uppercase"><span style="width:24px;height:3px;background:currentColor"></span>Next game · 12 days</div>
<h3 style="margin:8px 0 0;font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:32px;line-height:.86;letter-spacing:-.06em;text-transform:uppercase;color:#080706">Bulls vs. Rattlers</h3>
<div style="margin-top:6px;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:10px;letter-spacing:.17em;text-transform:uppercase">Mar 20 · Doors 5:30 PM · Kickoff 7:00 PM</div>
</div>
</div>
<div style="padding:0 18px;display:flex;align-items:baseline;justify-content:space-between;gap:12px">
<h2 style="margin:0;font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:30px;line-height:.86;letter-spacing:-.06em;text-transform:uppercase;color:#f3eee6">Earn this week</h2>
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.Tag" tone="orange" hint-size="110px,24px">3 game streak</x-import>
</div>
<div style="padding:0 18px;display:flex;flex-direction:column;gap:12px">
<sc-for list="{{ challenges }}" as="c" hint-placeholder-count="3">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.ChallengeRow" dc-props="{{ c }}" hint-size="100%,86px"></x-import>
</sc-for>
</div>
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.Ticker" speed="{{ 18 }}" hint-size="100%,54px"></x-import>
<div style="padding:0 18px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.RewardCard" category="Experience" title="Sideline warmup pass" cost="{{ 4000 }}" flag="Limited" hint-size="100%,300px"></x-import>
</div>
</main>
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.TabBar" items="{{ tabs }}" active="home" hint-size="100%,74px"></x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:900},&quot;points&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:1240,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:0,&quot;max&quot;:20000,&quot;step&quot;:10,&quot;section&quot;:&quot;Fan&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const points = this.props.points ?? 1240;
    return {
      points,
      toNext: Math.max(0, 2000 - points),
      challenges: [
        { icon: "map-pin", title: "Check in at the gate", detail: "Opening night only", reward: 250, progress: 0, goal: 1 },
        { icon: "flame", title: "Attend three straight", detail: "2 of 3 home games", reward: 1000, progress: 2, goal: 3 },
        { icon: "share-2", title: "Bring a friend", detail: "Referral joined March 4", reward: 500, done: true }
      ],
      tabs: [
        { id: "home", label: "Home", icon: "house" },
        { id: "rewards", label: "Rewards", icon: "gift", count: 3 },
        { id: "gameday", label: "Game day", icon: "ticket" },
        { id: "rank", label: "Rank", icon: "trophy" },
        { id: "me", label: "Me", icon: "user" }
      ]
    };
  }
}

</script>
</body>
</html>
