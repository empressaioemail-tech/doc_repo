<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Marketing section" description="Full-bleed photo section with the ATX Bulls copy stack: eyebrow, display headline with orange emphasis, uppercase lede, chamfered CTA, proof row." -->
<helmet>
<script src="./ds-base.js"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>body{margin:0;background:#080706}</style>
</helmet>
<section style="position:relative;min-height:920px;display:flex;align-items:center;overflow:hidden;border-top:1px solid #f3eee62b">
<img src="https://atxbulls.com/family-arena-2027.png" alt="ATX Bulls fans inside a packed arena" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.95) contrast(1.04)">
<div style="position:absolute;inset:0;background:linear-gradient(90deg,#050403 0%,#050403f2 34%,#04030299 58%,transparent 92%)"></div>
<div style="position:absolute;inset:0;background-image:linear-gradient(#f3eee62b 1px,transparent 1px),linear-gradient(90deg,#f3eee62b 1px,transparent 1px);background-size:88px 88px;-webkit-mask-image:linear-gradient(90deg,#000 0,#000 42%,transparent 72%);mask-image:linear-gradient(90deg,#000 0,#000 42%,transparent 72%)"></div>
<div style="position:absolute;inset:0;background:radial-gradient(circle at 66% 45%,#f25a1824,transparent 34%)"></div>
<div style="position:absolute;inset:0;background:linear-gradient(to top,#080706 0%,#08070600 32%)"></div>
<div style="position:absolute;right:110px;top:150px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.Stamp" lines="{{ stampLines }}" hint-size="112px,112px"></x-import>
</div>
<div style="position:relative;z-index:2;width:min(100% - 64px,1280px);margin-inline:auto;padding-block:96px">
<div style="display:flex;align-items:center;gap:12px;margin:0 0 24px;color:#f25a18;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:12px;line-height:1;letter-spacing:.2em;text-transform:uppercase">
<span style="display:block;width:34px;height:3px;background:currentColor"></span>Opening night. March 20, 2027
</div>
<h2 style="margin:0;max-width:14ch;font-family:'Archivo Black',Impact,sans-serif;font-weight:400;font-size:clamp(58px,8.3vw,118px);line-height:.86;letter-spacing:-.06em;text-transform:uppercase;color:#f3eee6">Austin. <em style="font-style:normal;color:#f25a18">Pick your side.</em></h2>
<p style="margin:22px 0 0;max-width:26ch;font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(19px,2vw,28px);line-height:1.2;text-transform:uppercase;color:#d0c6bd">Make memories you’ll never forget.</p>
<div style="margin-top:34px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.Button" size="lg" glow="{{ true }}" hint-size="280px,64px">Save your seats</x-import>
</div>
<div style="margin-top:44px;max-width:620px">
<x-import component-from-global-scope="ATXBullsDesignSystem_a4b13b.ProofRow" items="{{ proof }}" hint-size="100%,58px"></x-import>
</div>
</div>
</section>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      stampLines: ["ARE", "YOU", "READY?"],
      proof: ["2027 season", "Arena football", "Austin, Texas"],
      true: true
    };
  }
}

</script>
</body>
</html>
