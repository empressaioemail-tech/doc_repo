<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}

<div class="main"><img src="assets/atx-bulls-lockup-on-orange.png" alt="ATX Bulls"></div>
<div class="strip">
<span style="background:#f3eee6"></span>
<span style="background:#a79d94"></span>
<span style="background:#bf4016"></span>
<span style="background:#15110f"></span>
</div>
</body></html>
