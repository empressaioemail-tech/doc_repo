<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Hauska fabric: stakeholders, engine, and real property lineage</title>
<desc>Stakeholder surfaces (architect, reviewer, city manager, future) sit on top of the Hauska fabric, which contains the Hauska Engine, the corpus, and the Hauska SDK. The fabric reads and writes atoms scoped to a real property, whose lineage chain captures every event over time, from design submission through ownership transfer.</desc>
<style>
.t { font-family: sans-serif; font-size: 14px; font-weight: 400; fill: #2C2C2A; }
.ts { font-family: sans-serif; font-size: 12px; font-weight: 400; fill: #5F5E5A; }
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #2C2C2A; }
.box { fill: #F1EFE8; stroke: #888780; }
.arr { stroke: #5F5E5A; stroke-width: 1.5; fill: none; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple .t, .c-purple .th { fill: #3C3489; }
.c-purple .ts { fill: #534AB7; }
.c-teal rect { fill: #E1F5EE; stroke: #0F6E56; }
.c-teal .t, .c-teal .th { fill: #085041; }
.c-teal .ts { fill: #0F6E56; }
.c-amber rect { fill: #FAEEDA; stroke: #854F0B; }
.c-amber .t, .c-amber .th { fill: #633806; }
.c-amber .ts { fill: #854F0B; }
@media (prefers-color-scheme: dark) {
.t, .th { fill: #D3D1C7; }
.ts { fill: #B4B2A9; }
.box { fill: #2C2C2A; stroke: #888780; }
.arr { stroke: #B4B2A9; }
.c-purple rect { fill: #3C3489; stroke: #AFA9EC; }
.c-purple .t, .c-purple .th { fill: #CECBF6; }
.c-purple .ts { fill: #AFA9EC; }
.c-teal rect { fill: #085041; stroke: #5DCAA5; }
.c-teal .t, .c-teal .th { fill: #9FE1CB; }
.c-teal .ts { fill: #5DCAA5; }
.c-amber rect { fill: #633806; stroke: #EF9F27; }
.c-amber .t, .c-amber .th { fill: #FAC775; }
.c-amber .ts { fill: #EF9F27; }
}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<text class="ts" x="40" y="24">Stakeholder surfaces</text>
<g class="c-purple">
<rect x="50" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="115" y="62" text-anchor="middle" dominant-baseline="central">Architect</text>
<text class="ts" x="115" y="80" text-anchor="middle" dominant-baseline="central">Design Accelerator</text>
</g>
<g class="c-purple">
<rect x="200" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="265" y="62" text-anchor="middle" dominant-baseline="central">Reviewer</text>
<text class="ts" x="265" y="80" text-anchor="middle" dominant-baseline="central">Codex</text>
</g>
<g class="c-purple">
<rect x="350" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="415" y="62" text-anchor="middle" dominant-baseline="central">City manager</text>
<text class="ts" x="415" y="80" text-anchor="middle" dominant-baseline="central">SmartCity OS</text>
</g>
<g class="c-purple">
<rect x="500" y="40" width="130" height="56" rx="8" stroke-width="0.5"/>
<text class="th" x="565" y="62" text-anchor="middle" dominant-baseline="central">Future</text>
<text class="ts" x="565" y="80" text-anchor="middle" dominant-baseline="central">Inspector, owner, builder</text>
</g>
<text class="ts" x="40" y="128">All surfaces operate on the same fabric and corpus</text>
<rect class="box" x="40" y="140" width="380" height="300" rx="20" stroke-width="0.5"/>
<text class="th" x="60" y="170" dominant-baseline="central">Hauska fabric</text>
<g class="c-teal">
<rect x="60" y="190" width="340" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="212" text-anchor="middle" dominant-baseline="central">Hauska Engine</text>
<text class="ts" x="230" y="232" text-anchor="middle" dominant-baseline="central">Compliance, briefing, retrieval</text>
</g>
<g class="c-teal">
<rect x="60" y="270" width="340" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="292" text-anchor="middle" dominant-baseline="central">Corpus</text>
<text class="ts" x="230" y="312" text-anchor="middle" dominant-baseline="central">Code, parcel, firm precedent</text>
</g>
<g class="c-teal">
<rect x="60" y="350" width="340" height="60" rx="8" stroke-width="0.5"/>
<text class="th" x="230" y="372" text-anchor="middle" dominant-baseline="central">Hauska SDK</text>
<text class="ts" x="230" y="392" text-anchor="middle" dominant-baseline="central">Atom contract, signed chain</text>
</g>
<g class="c-amber">
<rect x="440" y="140" width="200" height="300" rx="20" stroke-width="0.5"/>
<text class="th" x="540" y="170" text-anchor="middle" dominant-baseline="central">Real property</text>
<rect x="490" y="190" width="100" height="32" rx="6" stroke-width="1"/>
<text class="th" x="540" y="206" text-anchor="middle" dominant-baseline="central">parcel atom</text>
</g>
<line x1="540" y1="222" x2="540" y2="240" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="252" text-anchor="middle" dominant-baseline="central">Design submitted</text>
<line x1="540" y1="262" x2="540" y2="278" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="290" text-anchor="middle" dominant-baseline="central">Review findings</text>
<line x1="540" y1="300" x2="540" y2="316" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="328" text-anchor="middle" dominant-baseline="central">Permit issued</text>
<line x1="540" y1="338" x2="540" y2="354" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="366" text-anchor="middle" dominant-baseline="central">Inspections logged</text>
<line x1="540" y1="376" x2="540" y2="392" stroke="#888780" stroke-width="0.5"/>
<text class="ts" x="540" y="404" text-anchor="middle" dominant-baseline="central">Ownership transfer</text>
<line x1="540" y1="414" x2="540" y2="430" stroke="#888780" stroke-width="0.5" stroke-dasharray="3 3"/>
<text class="ts" x="430" y="285" text-anchor="middle" dominant-baseline="central">scoped atoms</text>
<line x1="420" y1="295" x2="440" y2="295" class="arr" marker-end="url(#arrow)"/>
</svg>
