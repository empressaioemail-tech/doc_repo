  - public_free_examples: [bastrop_udc, grand_county_irc]
  - platform_internal_examples: [elgin, bastrop_county, smithville_deferred]

marketing_surface:
  public_registry_tools: [search_atoms, get_atom, list_jurisdictions, search_permit_atoms, query_jurisdiction]
  public_registry_plus_gtm_when_shipped: [resolve_place, get_place_layers, get_place_dossier, list_property_workspaces, get_property_workspace, list_workspace_share_edges]
