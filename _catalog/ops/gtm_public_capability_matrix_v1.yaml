    mcp_name: search_atoms
    deploy_status: shipped
    tier: public_layer_1
    product_gate: none
    data_planes: [A_public_law]
    anonymous_ok: true
    attribution_required: true
    notes: "Returns code-section atoms; jurisdiction must be public-free in engine."

  - id: get_atom
    mcp_name: get_atom
    deploy_status: shipped
    tier: public_layer_1
