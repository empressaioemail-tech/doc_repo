  - id: hydrology_flood
    layer1_free: "FEMA NFHL flood zone + NOAA Atlas 14 design storms (federal public-records)"
    layer2_paid_reasoning: "site drainage simulation + cited flood-risk reasoning"
    sellable_today: true
    state: "LIVE on engine-api with real pysheds (the broken native-D8 fallback is gone on the spine path); Cotality flood-depth forcing activatable, deploy-pending"
    buyers: [civil, insurer, developer]
    not_sold: "FEMA flood-zone lookup / NOAA tables are L1, not a resale SKU"

  - id: parcel_property
    layer1_free: "Cotality parcel/zoning public-records baseline (Regrid DROPPED)"
    layer2_paid_reasoning: "property brief reasoning + encumbrance/restriction analysis (ADR-020/021), cited"
    sellable_today: true
