# --- v1.1: data-package mapping + spine capabilities (sellable-today vs at-launch) ---
# Authority: 76d §2-3, 55 spine stack, 52 build-out. Each package L2 sells reasoning over the
# domain; the raw national/federal baseline stays L1 free (sell-reasoning binding constraint).

data_packages:
  - id: subsurface
    layer1_free: "SSURGO soils + USGS geology/groundwater/seismic baseline (federal public-records)"
    layer2_paid_reasoning: "site-level subsurface risk assessment (bearing, shrink-swell, hydric, liquefaction, karst), cited"
    sellable_today: false
    state: "adapters merged (PR #145), deploy-pending; Cotality mineral/utility inert (OAuth)"
    buyers: [geotech, civil, landman, oil_and_gas]
    not_sold: "raw SSURGO map units / USGS rasters are L1, not a resale SKU"

  - id: hydrology_flood
    layer1_free: "FEMA NFHL flood zone + NOAA Atlas 14 design storms (federal public-records)"
    layer2_paid_reasoning: "site drainage simulation + cited flood-risk reasoning"
    sellable_today: true
    state: "live (PR #142); pysheds sidecar not baked into Cloud Run image (TS fallback works); Cotality flood-depth inert"
    buyers: [civil, insurer, developer]
    not_sold: "FEMA flood-zone lookup / NOAA tables are L1, not a resale SKU"

  - id: parcel_property
    layer1_free: "Regrid parcel/zoning public-records baseline"
    layer2_paid_reasoning: "property brief reasoning + encumbrance/restriction analysis (ADR-020/021), cited"
    sellable_today: true
    state: "brief pipeline live (UI/extension only until generate_property_brief wrap); Cotality primary but inert (OAuth)"
    buyers: [broker, landman, appraiser]
    not_sold: "Regrid geometry is national public-records aggregation, not a tile resale SKU; no city operational data"

  - id: code_plan_review
    layer1_free: "ADA 2010 + FHA Design Manual (public-free, federal-accessibility-standards tenant) + public-free city code (Bastrop, Grand County)"
    layer2_paid_reasoning: "most-stringent-governs precedence reconciliation + per-discipline plan-set findings, cited"
    sellable_today: true
    state: "richest package; precedence engine (PR #147) + decomposition (PR #146) + accessibility corpus (PR #66) merged; A117.1 + I-Codes credential-pending (ICC OAuth)"
    buyers: [architect, plan_reviewer, ahj]
    not_sold: "ADA/FHA/public-free code text is L1; the conf-0.91 reconciliation demo number is a RAW LLM emission, not calibrated"

  - id: environmental
    layer1_free: "EPA EJScreen (frozen CalEPA mirror — surface freshness caveat)"
    layer2_paid_reasoning: "EJ/habitat context reasoning (deferred — thin package)"
    sellable_today: false
    state: "EJ teaser only; FCC broadband gated (WAF); no wetlands/species/air adapters. Hold from headline launch."
    buyers: [planner, esg]
    not_sold: "EPA EJScreen is L1 federal data; no paid SKU yet"

spine_capabilities_added_since_v1.0:
  - id: accessibility_corpus
    sellable_today: true
    gate: "ADA/FHA live public-free; A117.1 + IRC 2021 credential-pending (ICC OAuth)"
  - id: precedence_reconciliation_engine
    sellable_today: true
    gate: "reconcileStandardPrecedence live (PR #147); rule-label taxonomy follow-up flagged (federal-preempts vs most-stringent-governs)"
  - id: plan_set_decomposition
    sellable_today: true
    gate: "merged (PR #146); per-discipline finding routing"
  - id: subsurface_adapters
    sellable_today: false
    gate: "merged (PR #145), deploy-pending"
  - id: hydrology
    sellable_today: true
    gate: "live (PR #142); pysheds sidecar deploy gap"

