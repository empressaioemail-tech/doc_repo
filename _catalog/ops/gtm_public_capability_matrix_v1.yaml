    layer1_free: "SSURGO soils + USGS geology/groundwater/seismic baseline (federal public-records)"
    layer2_paid_reasoning: "site-level subsurface risk assessment (bearing, shrink-swell, hydric, liquefaction, karst), cited"
    sellable_today: false
    state: "adapters on engine-api (PR #145 lifted); Cotality mineral/utility SOLVED, deploy-pending on the convergent cortex-api deploy"
    buyers: [geotech, civil, landman, oil_and_gas]
