version: "1.1"
canonical_docs_url: "https://hauska.dev/mcp"
mcp_transport_url: "https://mcp.hauska.dev/mcp"
public_claim: "Texas building code + accessibility-standards MCP + property/site reasoning (Layer 2)"

# Honesty discipline (load-bearing). Any external corpus number carries the public-vs-internal split.
# Never a bare headline number. Confidence is the raw LLM emission, uncalibrated; do not claim calibration.
corpus_honesty:
  total_ingested: "34 jurisdictions / ~21,126 atoms (committed snapshot 2026-05-26) — NOT a public figure"
  public_free: "~478 atoms across 2 jurisdictions (Bastrop 193 on B3 edition, Grand County/Moab 285)"
  public_free_plus: "federal-accessibility-standards tenant — ADA 2010 (901 sections) + FHA Design Manual (212 sections), public-free (PR #66)"
  platform_internal: "32 of 34 jurisdictions; never marketed as public-free"
  calibration: "confidence scores are the raw LLM number, uncalibrated; arrow-two (04a) is the unlanded mechanism that earns calibration. No 'calibrated' claim in any copy."

inventory:
  shipped_mcp_tools: 46
  breakdown: "11 public (catalog + place) + 4 Codex + 31 Cortex; gated at call time by X-Hauska-Key (no header -> public; bad key -> 401)"
  authority_doc: 52_mcp_offer_and_buildout.md
  notes: "tools/list returns all 46 to every caller; product gates fire at call time, not list time. The v1.0 figure of 40 is superseded."

attribution:
  free_tier: "Powered by Hauska Engine — hauska.dev"
  required_on: [mcp_response_metadata, docs_examples]

