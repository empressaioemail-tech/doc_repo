version: "1.0"
canonical_docs_url: "https://hauska.dev/mcp"
mcp_transport_url: "https://mcp.hauska.dev/mcp"
public_claim: "Texas building code MCP + property workspace read API"

inventory:
  shipped_mcp_tools: 40
  breakdown: "5 public catalog + 4 Codex + 31 Cortex (flat underscore names per 44_mcp_cortex_architecture_map.md)"
  gtm_sprint_planned_mcp_tools: 6
  authority_doc: 50_hauska_mcp_server.md
  notes: "tools/list returns all 40 to every caller; product gates fire at call time, not list time."

attribution:
  free_tier: "Powered by Hauska Engine — hauska.dev"
  required_on: [mcp_response_metadata, docs_examples]

# --- Shipped public catalog (Layer 1; anonymous_ok where noted) ---

tools:
