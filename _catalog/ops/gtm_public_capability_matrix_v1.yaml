# Honesty discipline (load-bearing). Any external corpus number carries the public-vs-internal split.
# Never a bare headline number. Confidence is the raw LLM emission, uncalibrated; do not claim calibration.
corpus_honesty:
  total_ingested: "34 jurisdictions / ~21,126 atoms (committed snapshot 2026-05-26) — NOT a public figure"
  public_free: "~478 atoms across 2 jurisdictions (Bastrop 193 on B3 edition, Grand County/Moab 285)"
  public_free_plus: "federal-accessibility-standards tenant — ADA 2010 (901 sections) + FHA Design Manual (212 sections), public-free (PR #66)"
  platform_internal: "32 of 34 jurisdictions; never marketed as public-free"
  texas_deepening: "Austin 2024 web-warmed (58 B-rewarm); web-verified rate uplifted but public-vs-internal split for the new web-warmed atoms must be re-verified before any is marketed public-free"
  calibration: "the calibration engine computes effectiveConfidence but the live read path does not consult it (2026-06-11 audit: asserted-not-earned; briefing/code-atom hardcode 1.0). The uniform provenance envelope (58 app-by-app cut) is the fix. No 'calibrated' claim in any copy."

inventory:
