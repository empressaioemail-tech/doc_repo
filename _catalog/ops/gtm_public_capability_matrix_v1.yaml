  - id: code_plan_review
    layer1_free: "ADA 2010 + FHA Design Manual (public-free, federal-accessibility-standards tenant) + public-free city code (Bastrop, Grand County); web-first deeplinks elsewhere"
    layer2_paid_reasoning: "most-stringent-governs precedence reconciliation (federal accessibility + adopted model code + local amendments, same dimension) + per-discipline plan-set findings, cited"
    sellable_today: true
    state: "richest; precedence WIRED into the production finding path (S1, no longer test-fixture-only); decomposition live; Austin 2024 hero metro; A117.1 + I-Codes credential-pending (ICC OAuth)"
