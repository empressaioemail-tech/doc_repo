http_routes:
  - path: GET /api/brokerage/v1/coverage
    deploy_status: shipped
    tier: public_read
    anonymous_ok: true
    notes: "Honesty list for Central TX pilot; no PII."

  - path: POST /api/brokerage/v1/brief
    deploy_status: shipped
    tier: product
    product_gate: brokerage_key
    data_planes: [A, C, D]
    notes: "Human wedge; extension-facing."

  - path: POST /api/brokerage/v1/place/resolve
    deploy_status: gtm_sprint_planned
    tier: product
    product_gate: brokerage_or_service_key
    data_planes: [C_parcel_economics]
    notes: "Backing HTTP for resolve_place MCP tool."

  - path: GET /api/brokerage/v1/place/:placeKey/layers
    deploy_status: gtm_sprint_planned
    tier: product
    product_gate: brokerage_or_service_key
    data_planes: [C_parcel_economics, D_physical]

  - path: GET /api/brokerage/v1/place/:placeKey/dossier
    deploy_status: gtm_sprint_planned
    tier: product
    product_gate: brokerage_or_service_key
    data_planes: [A, C, D]
    notes: "Max payload budget; citations required."

  - path: POST /api/brokerage/v1/gtm/mcp-event
    deploy_status: gtm_sprint_planned
    tier: internal
    product_gate: brokerage_or_service_key
    notes: "Observation only; not marketed."

  - path: GET /api/brokerage/v1/gtm/digest
    deploy_status: shipped
    tier: internal
    product_gate: brokerage_key
    notes: "Steward digest; filter source_surface=mcp after migration 0029."

