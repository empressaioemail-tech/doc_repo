# Code-warming reference manifest — IFC + IPMC 2021 (fire / property maintenance)
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT reviewed/committed as canonical.
# Load-bearing fields: section + title. Harness verifies edition+section and fetches authoritative URL at warm time.
# source_domains: ICC Digital Codes (IFC2021P1 / IPMC2021P1), UpCodes.
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: IFC + IPMC
edition_base: "2021"
source_domains: [icc_digital_codes, upcodes]
enumeration_method: >
  From 2021 IFC and IPMC TOCs. IFC weighted to Ch.5 access/water, Ch.9 fire-protection systems,
  Ch.10 egress (mirrors IBC Ch.10), Ch.50/53/57 hazmat. IPMC scoped to habitability, light/vent/
  occupancy, MEP-maintenance, exterior/structural-maintenance that code enforcement cites.
caveats: >
  ERCES is Section 510 (new) with existing-building maintenance at 1103.2; the testing cross-ref is
  the slot most likely off. Fire flow is Appendix B (adopted by reference in most jurisdictions).
  Hazmat MAQ Table 5003.1.1(1)-(4) cited generally. IPMC habitability sub-decimals (404.x) medium conf.

