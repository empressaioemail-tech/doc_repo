# Code-warming reference manifest — IECC 2021 (energy)
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT yet reviewed/committed as canonical.
# Load-bearing fields: section number + title. url_confidence is low throughout (agent did not live-fetch);
# the cold-warm harness verifies edition+section and fetches the authoritative URL at warm time.
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: IECC energy
edition_base: "2021"
enumeration_method: >
  Curated from working knowledge of the 2021 IECC Residential Provisions (R-chapters / RE
  compliance) and Commercial Provisions (C-chapters / CE compliance), prioritizing sections that
  recur in real energy-code plan review and permitting: envelope insulation, fenestration
  U-factor/SHGC, air leakage/blower-door, duct sealing/insulation, mechanical equipment
  efficiency, service water heating, interior/exterior lighting power and controls, and the
  prescriptive/performance/ERI compliance paths. ~90 sections across both volumes. Not exhaustive.
caveats: >
  RENUMBERING REALITY CHECK: the 2021 IECC was published as two separable documents (Residential
  Provisions chapters RE/R, Commercial Provisions chapters CE/C). The substantive section numbers
  carried over from 2018 largely INTACT (residential R401-R406, commercial C401-C409); there was
  NO wholesale digit-renumbering of technical sections in 2021. Real 2021 changes: residential
  air-leakage tightened (R402.4.1.2, generally 5 ACH50 CZ1-2 and 3 ACH50 CZ3-8), commercial C405
  lighting controls and C406 additional-efficiency credits expanded, R406 ERI thresholds revised.
  Section numbers below are high-confidence as published 2021 identifiers; all deep URLs are
  url_confidence: low (agent could not open ICC/UpCodes/DOE pages this session). Every gist is a
  paraphrase; no verbatim code text reproduced.
igcc_note: >
  IgCC (2021, ICC/ASHRAE 189.1-based green overlay) routes energy compliance through ASHRAE 90.1
  rather than IECC prescriptive tables, is not a section-for-section IECC substitute, and is adopted
  by few jurisdictions (often public/municipal projects only). No section dump warranted; treat as
  jurisdiction-specific overlay, confirm local amendment where adopted.

