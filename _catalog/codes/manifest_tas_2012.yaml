# Code-warming reference manifest — TAS 2012 (Texas Accessibility Standards)
# Status: DRAFT Austin launch hero — statewide TDLR standard (distinct from ADA/FHA/A117.1)
# Load-bearing: section + title. Web-groundable via TDLR published standard.
# Boundary: section numbers/titles only — NO verbatim normative code text.

family: TAS accessibility (statewide)
edition_base: "2012"
source_domains: [tdlr]
enumeration_method: >
  High-traffic TAS 2012 sections from TDLR chapter map — scoping, routes, plumbing, recreation.
caveats: >
  TAS numbering mirrors ADA-style chapters. Deeplink to TDLR until section HTML extraction confirmed.

codes:
  - code: TAS
    edition: "2012"
    sections:
      - { section: "202",     title: "Existing Buildings and Facilities", discipline: accessibility, traffic: high }
      - { section: "207",     title: "Accessible Means of Egress", discipline: accessibility, traffic: high }
      - { section: "302",     title: "Floor or Ground Surfaces", discipline: accessibility, traffic: high }
      - { section: "303",     title: "Changes in Level", discipline: accessibility, traffic: high }
      - { section: "304",     title: "Turning Space", discipline: accessibility, traffic: high }
      - { section: "305",     title: "Clear Floor or Ground Space", discipline: accessibility, traffic: high }
      - { section: "308.2",   title: "Forward Reach", discipline: accessibility, traffic: high }
      - { section: "308.3",   title: "Side Reach", discipline: accessibility, traffic: high }
      - { section: "402",     title: "Accessible Routes", discipline: accessibility, traffic: high }
      - { section: "404",     title: "Doors, Doorways, and Gates", discipline: accessibility, traffic: high }
      - { section: "404.2.3", title: "Maneuvering Clearances at Doors", discipline: accessibility, traffic: high, verify: true }
      - { section: "405",     title: "Ramps", discipline: accessibility, traffic: high }
      - { section: "502",     title: "Parking Spaces", discipline: accessibility, traffic: high }
      - { section: "603",     title: "Toilet and Bathing Rooms", discipline: accessibility, traffic: high }
      - { section: "604",     title: "Water Closets and Toilet Compartments", discipline: accessibility, traffic: high }
      - { section: "606",     title: "Lavatories and Sinks", discipline: accessibility, traffic: high }
      - { section: "608",     title: "Shower Compartments", discipline: accessibility, traffic: high }
      - { section: "702",     title: "Fire Alarm Systems", discipline: accessibility, traffic: medium }
      - { section: "802",     title: "Wheelchair Spaces (Assembly)", discipline: accessibility, traffic: medium }
      - { section: "804",     title: "Kitchens and Kitchenettes", discipline: accessibility, traffic: high }
      - { section: "1004",    title: "Exercise Machines and Equipment", discipline: accessibility, traffic: medium }
      - { section: "1009",    title: "Swimming Pools, Wading Pools, and Spas", discipline: accessibility, traffic: high }
