# Code-warming reference manifest — IRC 2024 (residential) — Austin adopted package
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT reviewed/committed as canonical.
# Load-bearing fields: section + title. Harness verifies edition+section and fetches authoritative URL at warm time.
# source_domains tried by harness: ICC Digital Codes (codes.iccsafe.org/content/IRC2024P1), UpCodes (up.codes).
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: IRC residential
edition_base: "2024"
source_domains: [icc_digital_codes, upcodes]
enumeration_method: >
  Authored from the 2024 IRC table of contents (building Ch.1-11, N11xx energy, M mechanical,
  G fuel gas, P plumbing, E electrical pointers), weighted to one/two-family + townhouse plan review.
caveats: >
  Austin in-force July 10 2025. 2024 IRC renumbering vs 2024 on deck/energy chapters — verify:true decimals mandatory. Flagged low-confidence decimals: R310.4.x window-well family;
  N-chapter energy decimals (mirror IECC-R); R507.x deck ledger/lateral-load child decimals;
  R802.x rafter/ceiling renumbered in 2024. Verify flagged decimals against live 2024 TOC.

