# Code-warming reference manifest — accessibility + NFPA-track
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT reviewed/committed as canonical.
# Load-bearing fields: code + edition + section + title + grounding. Harness verifies and fetches at warm time.
# GROUNDING FLAG IS LOAD-BEARING:
#   web-groundable          -> warm via ICC Digital Codes / UpCodes (A117.1) at warm time
#   verify-existing-corpus  -> federal accessibility likely already in corpus; DIFF before warming, do not duplicate
#   NFPA-license-required   -> NEC/NFPA101 NOT on ICC; deeplink to nfpa.org free access ONLY, no grounded text until NFPA track lands
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: accessibility + NFPA-track
source_domains: [icc_digital_codes, upcodes, ada_gov, nfpa_free_access]
enumeration_method: >
  Group 1 from ICC A117.1-2017 chapter map (referenced by 2021 IBC). Group 2 a short most-cited
  subset of ADA 2010 Standards + the FHA seven design requirements. Group 3 from NEC 2020 article
  structure and NFPA 101-2021 egress/occupancy chapters.
caveats: >
  A117.1: 2021 IBC references 2017 edition; 2009 remains in force where IBC is 2015 or earlier -
  confirm locally adopted IBC edition before warming; Ch.9 dwelling-unit numbering shifted across
  editions. ADA 2010 stable. FHA "seven" are scoping concepts (24 CFR 100.205 / HUD Guidelines),
  not numbered sections. NEC edition shown 2020 (many on 2017, some 2023) - confirm locally. NFPA 101
  shown 2021. NEC/NFPA101 are reference-only until the NFPA license/track lands.

