# Code-warming reference manifest — IBC + IEBC 2021 (commercial / existing building)
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT reviewed/committed as canonical.
# Load-bearing fields: section + title. Harness verifies edition+section and fetches authoritative URL at warm time.
# source_domains: ICC Digital Codes (codes.iccsafe.org/content/IBC2021P1, IEBC2021P1), UpCodes.
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: IBC + IEBC commercial
edition_base: "2021"
source_domains: [icc_digital_codes, upcodes]
enumeration_method: >
  From the published 2021 IBC and IEBC TOCs, weighted to commercial/multifamily plan review.
  IBC egress under Section 1006 (2015+ structure carried to 2021). IEBC retains three compliance
  methods (prescriptive / work-area / performance).
caveats: >
  Table 721.1 is three sub-tables 721.1(1) walls / (2) floor-roof / (3) beams-columns. IEBC work-area
  sub-section decimals (804.2.1, 1011.x, 1401.3) medium confidence. "202-SI" is a synthetic key for the
  substantial-improvement/substantial-damage definition within Chapter 2. Verify flagged decimals.

