# Code-warming reference manifest — UMC + UPC + IFGC 2024 (commercial MEP)
# Status: DRAFT, authored 2026-06-09 by background research agent. NOT reviewed/committed as canonical.
# Load-bearing fields: section + title. Harness verifies edition+section and fetches authoritative URL at warm time.
# source_domains: ICC Digital Codes (UMC2024P1 / UPC2024P1 / IFGC2024P1), UpCodes.
# Boundary: section numbers/titles/gist only — NO verbatim normative code text.

family: UMC + UPC + IFGC
edition_base: "2024"
source_domains: [icc_digital_codes, upcodes]
enumeration_method: >
  From 2024 UMC/UPC/IFGC TOCs, weighted to commercial/multifamily MEP plan review (dwelling-scale
  equivalents live in IRC). UMC master ventilation table at 403.3.1.1; UPC fixture table at 403.1;
  IFGC pipe-sizing in 402 with sub-tables.
caveats: >
  UMC duct/exhaust sub-decimals (506.x grease duct, 510.x hazardous exhaust) confirmed at parent;
  re-verify sub-decimals against live 2024 TOC. A few jurisdictions still reference 403.3 as the
  ventilation-table parent vs 403.3.1.1.

