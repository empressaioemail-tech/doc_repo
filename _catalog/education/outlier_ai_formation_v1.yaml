# formation-pattern:outlier-ai-v1 | prose: 78a | schema: 78
# additive portfolio intelligence — NOT hauska substrate
# as_of: 2026-05-27

pattern:
  id: outlier-ai-v1
  label: Outlier AI researcher formation
  summary: >
    Evidence-weighted formation: lab FT concurrent with degree, grad courses early,
    lecture digests, flagship artifacts before terminal degree; PhD optional.

credentials_archetype:
  - { stage: hs_concurrent_college, status: completed }
  - { stage: bs_cs, status: completed }
  - { stage: phd, status: dropped_or_offers_only }

course_template_ids:  # example codes from ingested public syllabus
  - { code: CSE576, domain: computer_vision, level: grad, year_band: fr }
  - { code: CSE571, domain: robotics, level: grad, year_band: fr }
  - { code: CSE512, domain: visualization, level: grad, year_band: so }
  - { code: CSE573, domain: ai, level: grad, year_band: jr }
  - { code: CSE590R, domain: robotics_colloquium, level: grad, year_band: jr }

self_curriculum_templates:
  - { topic: vision_classical_to_deep, mirrors: public_grad_vision_syllabus }
  - { topic: deep_learning_survey, mirrors: public_grad_dl_syllabus }
  - { topic: cnns_visual_recognition, mirrors: public_vision_recognition_syllabus }

lab_embedding:
  - { mode: intern, concurrent: [bs_cs] }
  - { mode: full_time_research, concurrent: [bs_cs, phd_attempt] }

evidence_clusters:
  - embodied_ai
  - multimodal_vlm
  - sim2real
  - research_engineering

pillars:
  - build_before_credential
  - grad_course_compression
  - lecture_digests
  - lab_concurrent_degree
  - artifacts_before_exit
  - degree_optionality

dependencies_org:
  - university_lab_colocation
  - advisor_network
  - lab_engineering_compute
  - high_individual_throughput

additive_rules:
  substrate_substitution: false
  retrieve_when: [hiring_bar, agent_curriculum, research_planning]
  omit_when: [jurisdiction_ingest, place_dossier, code_lookup]
