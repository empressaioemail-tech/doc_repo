# GTM launch channel plan v1 — Hauska MCP public launch
# Ratified 2026-06-06 per _decisions/2026-06-06_gtm_launch_channel_plan_decision_c.md (Decision C).
# Closes 16_commercialization_roadmap.md step 5. Referenced by step 1 launch dispatches.
# ICP: agent builder (Claude/Cursor developers on the SDK) per Decision A.
# Principle: developer-community distribution, free-tier-first (free Layer 1 = acquisition engine).

meta:
  version: v1
  ratified: 2026-06-06
  owner: nick
  gates_on: "16 step 1 — mcp.hauska.dev live over managed TLS, docs site live"

waves:
  - wave: 1
    when: at_launch
    name: directories_and_docs
    channels:
      - channel: mcp_directories
        targets: [anthropic_mcp_registry, mcp.so, smithery, glama]
        owner: cc-agent-M
        coordination: planner
        purpose: discoverability for agent builders browsing MCP servers
      - channel: docs_site
        owner: planner_drafts_operator_approves
        deliverable: "docs site + 'build a permit-research agent in 10 lines' quickstart against free Layer 1"
        purpose: free-tier acquisition; prove value before paid

  - wave: 2
    when: launch_week
    name: developer_community
    channels:
      - channel: claude_anthropic_mcp_community
        owner: nick            # founder voice, personally owned
        purpose: reach the primary ICP where they build
      - channel: cursor_community
        owner: nick            # founder voice, personally owned
        purpose: reach the coding-agent ICP

  - wave: 3
    when: ongoing
    name: content_cadence
    channels:
      - channel: build_with_hauska_posts
        cadence: one_per_jurisdiction_or_capability_milestone
        owner: planner_drafts_operator_posts
      - channel: partner_amplifiers
        targets: [icc, cotality]
        when: after_integrations_cited
        owner: nick
        purpose: secondary amplification once ICC/Cotality integrations are live and cited

sequencing_rules:
  - free_tier_first: "free Layer 1 signup + distribution ship before paid signup (16 step 3); pricing follows demand signal"
  - founder_voice: "community posts owned by operator, not agent-posted, at launch stage"

reversal_triggers:
  - "no inbound signal from directory listings within first launch window"
  - "one community channel (Claude vs Cursor) clearly dominates — concentrate there"
  - "Decision A shifts to reseller ICP — switch to partnership/BD channel"
