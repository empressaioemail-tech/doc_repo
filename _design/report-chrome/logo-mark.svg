<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none">
  <title>Smart Site mark</title>
  <desc>Ring only, for the running header at 20px. Stroke weight 3 so the ring survives at that size; the dot keeps true ss-gold #E8963B.</desc>
  <g transform="translate(10 10)" stroke="currentColor" stroke-width="3">
    <circle cx="38" cy="38" r="30" fill="none"></circle>
    <line x1="38" y1="0" x2="38" y2="14"></line>
    <line x1="38" y1="62" x2="38" y2="76"></line>
    <line x1="0" y1="38" x2="14" y2="38"></line>
    <line x1="62" y1="38" x2="76" y2="38"></line>
    <circle cx="38" cy="38" r="5" fill="#E8963B" stroke="none"></circle>
  </g>
</svg>
