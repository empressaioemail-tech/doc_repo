name: enforcement

# doc_repo had NO .github directory until 2026-08-20. Seven enforcement scripts sat in
# scripts/ with no trigger anywhere, which is the dormant-mechanism class this repo's own
# ENFORCEMENT.md opens by naming. This workflow is the trigger.
#
# THE FIRST VERSION OF THIS FILE WAS A FALSE GREEN, and it is recorded here rather than
# quietly fixed. It ran the not-yet-graduated controls under `continue-on-error: true`.
# That sets step.conclusion to success even at a non-zero exit, so run ee4ea4a rendered
# entirely green while cited-untracked was exiting 2 and doc-staleness was exiting 1.
# Same defect as TW-74 (protection present is not checks required), reproduced inside the
# workflow written to catch that class, in the same commit whose comment said silent
# degradation is prohibited.
#
# The replacement is a RATCHET, not an exemption. Every control has a pinned exit code in
# .github/enforcement-baseline.json. The job fails when a control does WORSE than its
# baseline, and when a control cannot be measured at all. Known debt is permitted and
# pinned. New debt fails the build. A control that is allowed to fail forever is not a
# control; a control whose failure may get worse is not even a measurement.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # cited-untracked and canon-divergence read git history. A shallow
                           # clone makes them answer confidently and wrongly: that is the
                           # starvation-by-environment failure recorded in
                           # _sessions/2026-08-20_t25_enumeration_handover.md, where a suite
                           # passed locally on a full clone and decided the wrong verdict on
                           # CI's depth-1 one.

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The two controls below are named separately so that when one of them fails, the run
      # view says WHICH. They are also covered by the ratchet; the duplication costs about a
      # second and buys legibility at the moment someone is looking at a red build.
      #
      # Both are BLOCKING because both were verified by violation on 2026-08-20: each was
      # made to fail on an injected defect and observed passing again after a byte-identical
      # restore. A check observed only passing has not been observed working.

      - name: C-00 vehicle sync (BLOCKING, violation-verified)
        # ENFORCEMENT.md and .cursor/rules/enforcement.mdc must not diverge. Claude Code
        # loads canon by @import; Cursor loads the regenerated copy. Drift means half the
        # fleet is running different rules from the other half and nothing says so.
        run: node scripts/enforcement/c-00-vehicle-sync.mjs

      - name: Plan registry divergence, CTRL-1 (BLOCKING, violation-verified)
        # Row-ID prefixes must never collide across plans, and both the dispatch compiler and
        # the canon gate must resolve paths from the registry rather than hardcoding them.
        run: node scripts/plan-registry-divergence.test.mjs

      - name: Memory promotion gate (BLOCKING, violation-verified)
        # The fleet memory loop had capture, a specification, and no trigger. Promotion had
        # never run once: the 2026-08-08 audit found the L3 grading rung executed zero times
        # in 215 sessions. This fails when the untriaged Tier 2 backlog GROWS, so capture is
        # never blocked and the planner must triage at least as fast as lessons arrive.
        # Triage is a decision; declining clears a file. Verified by violation.
        run: node scripts/enforcement/memory-promotion-gate.mjs

      - name: Hook loadability (BLOCKING, violation-verified)
        # SEAT-01 was registered on shell and write, threw ERR_MODULE_NOT_FOUND on every
        # invocation, and exited 0. It had never fired, and an operator ruling was made on
        # the assumption it was enforcing a seat boundary. Nothing checked that a registered
        # hook could load. This does. Found by the R-04 control census, 2026-08-21.
        #
        # 2026-09-18: extended to audit .cursor/hooks.json as well as .claude/settings.json,
        # because auditing only the Claude config left the Cursor config unaudited one level
        # up from the defect it was built for. It also resolves a run-gate.mjs registration to
        # the gate it names, so a registration pointing at a nonexistent gate is caught here
        # and not only by harness-parity.
        run: node scripts/enforcement/hooks-loadable.test.mjs

      - name: Harness parity (BLOCKING, violation-verified)
        # On 2026-09-18 the fleet ran eleven gates on Claude Code and one on Cursor, while
        # AGENTS.md told every agent that "the canon-gate hook blocks anything missing the
        # compiled markers". On Cursor that sentence was false. This enumerates both configs
        # and refuses an unexcused gap, AND refuses a .claude/hooks registration on Cursor
        # that skips run-gate.mjs, which would produce a gate that loads, runs, decides
        # nothing, and reports success.
        run: node scripts/enforcement/harness-parity.mjs

      - name: Cursor payload normalizer and gate adapter (BLOCKING, violation-verified)
        # The two instruments behind the port. The normalizer suite asserts the recorded
        # harness payloads translate to the shape the existing gates parse, against fixtures
        # captured from the live harness. The adapter suite runs the real gate files with
        # those payloads and asserts both the block and the allow verdict paths. Both were
        # observed failing on injected defects and passing after byte-identical restores.
        #
        # Declared limit: on this runner there is no PowerShell, so the canon-gate and
        # dispatch-template-gate checks print a DECLARED LIMIT block instead of running. The
        # adapter suite carries a portable node-gate refusal so a real block is still observed
        # here rather than dropping deny coverage silently.
        run: |
          node .cursor/hooks/normalize-payload.test.mjs
          node .cursor/hooks/run-gate.test.mjs

      - name: State generated + state budget (BLOCKING, violation-verified)
        # _STATE.md is the mandatory first read of every session in every seat, and on
        # 2026-09-18 it was 230,044 bytes, 213,766 of them one seat's file. This checks the
        # generated file against its generator AND against a per-seat byte ceiling pinned in
        # _state/state_budget.json. The budget runs here and not only in the writer because a
        # seat that grows without regenerating leaves _STATE.md matching its own generator
        # output: the drift comparison passes while the fleet-wide read just got fatter.
        run: node scripts/state/check-generated.mjs

      - name: Enforcement ratchet (all controls, fails on regression)
        # Runs every control in the baseline. Fails on REGRESSED (worse than pinned) and on
        # MISSING/UNMEASURED (absent is not zero). Refuses outright if the baseline file is
        # gone, because a ratchet with no baseline admits everything.
        #
        # Verified by violation 2026-08-20, three ways: pinned a known-failing control at 0
        # and got REGRESSED exit 1; pointed a control at a deleted script and got MISSING
        # exit 1; removed the baseline and got a refusal. Each restored byte-identical and
        # observed exit 0 again.
        run: node scripts/enforcement/ci-baseline.mjs
